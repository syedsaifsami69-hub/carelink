services:
  - type: web
    name: carelink
    runtime: node
    buildCommand: npm install && npm run build && npx prisma migrate deploy
    startCommand: node server/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: carelink-db
          property: connectionString
      - key: STORAGE_DIR
        value: /var/data/storage
    # uploaded lab files need persistent disk (paid plans); without it they are lost on every deploy
    disk:
      name: carelink-files
      mountPath: /var/data
      sizeGB: 1
databases:
  - name: carelink-db
    plan: free
