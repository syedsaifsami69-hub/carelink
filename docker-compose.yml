services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: carelink
      POSTGRES_PASSWORD: carelink_dev_only
      POSTGRES_DB: carelink
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./prisma/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carelink"]
      interval: 2s
      retries: 30
volumes:
  pgdata:
